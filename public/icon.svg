    <rect x="110" y="118" width="292" height="48" rx="12" />
    
    <!-- 'T' Stem -->
    <rect x="232" y="148" width="48" height="246" rx="10" />
    
    <!-- 'C' Outer Curve Intersecting Elegantly -->
    <path d="M 330 200 C 270 170, 160 210, 160 300 C 160 390, 270 430, 336 400 C 352 392, 360 376, 350 362 C 340 348, 324 348, 312 356 C 265 382, 206 352, 206 300 C 206 248, 265 218, 312 244 C 324 252, 340 252, 350 238 C 360 224, 350 210, 330 200 Z" />
