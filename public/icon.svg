<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1C1816" />
      <stop offset="100%" stopColor="#0F0D0C" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5D07A" />
      <stop offset="35%" stopColor="#CD9534" />
      <stop offset="70%" stopColor="#E5A93C" />
      <stop offset="100%" stopColor="#9B6F1E" />
    </linearGradient>
  </defs>

  <!-- High-contrast dark tile with rounded corners -->
  <rect width="512" height="512" rx="120" fill="url(#tileBg)" />
  <rect x="16" y="16" width="480" height="480" rx="104" stroke="url(#goldGrad)" stroke-width="14" stroke-opacity="0.6" />

  <!-- Bold, High-Clarity TC Monogram -->
